pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = "KikuGie Releases"
            url = "https://maven.kikugie.dev/releases"
        }
        maven {
            name = "KikuGie Snapshots"
            url = "https://maven.kikugie.dev/snapshots"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("dev.kikugie.stonecutter").version "0.10"
    id("org.gradle.toolchains.foojay-resolver-convention").version "1.0.0"
    id("dev.kikugie.loom-back-compat").version "0.4.2"
}

stonecutter {
    kotlinController = false
    centralScript = "stonecutter.gradle"

    create(getRootProject()) {
        def stonecutterConfig = delegate

        def match = { String project, List<String> loaders, String mcVersion ->
            loaders.each { loader ->
                version("${project}-${loader}", mcVersion)
                    .buildscript("build.${loader}.gradle")
            }
        }

        // , "neoforge"
        match("1.21.11", ["fabric"], "1.21.11") 
        match("26.1", ["fabric"], "26.1")
        match("26.2", ["fabric"], "26.2")
        match("26.3", ["fabric"], "26.3")
        vcsVersion = "26.3-fabric"
    }
}

rootProject.name = 'persistentgamemodeswitcher'